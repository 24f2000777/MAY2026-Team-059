[pytest]
testpaths = Testing
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# These are pre-existing manual integration scripts (interactive OTP prompts,
# require live Redis/SMTP), not real pytest suites yet, tracked separately
# under issue #27. Ignored here so a plain `pytest` run doesn't error out on
# them, not because anything is wrong with them.
#
# test_auth_full_suite.py is no longer in this list, it now has a real
# `client` pytest fixture (see the file) and is a genuine pytest suite.
addopts =
    --ignore=Testing/test_auth_service.py
    --ignore=Testing/test_auth_setup.py
    --ignore=Testing/test_db.py
